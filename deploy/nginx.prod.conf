# nginx.prod.conf — reverse proxy del stack completo.
# Un solo dominio; si se usan subdominios separar en server blocks.

upstream django_operativo { server backend-operativo:8000; }
upstream spring_corporativo { server backend-corporativo:8081; }
upstream sveltekit_corp { server frontend-corporativo:3000; }
upstream react_operativo { server frontend-operativo:80; }
upstream blockchain_gw { server blockchain-gateway:4000; }

# Redirección HTTPS (descomentar con certificados reales)
# server {
#     listen 80;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # ─── Sitio corporativo (público) ───
    location / {
        proxy_pass http://sveltekit_corp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API del backend corporativo (la llama el BFF server-side)
    location /api/corp/ {
        proxy_pass http://spring_corporativo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Aplicación operativa (inmuebles) ───
    location /app/ {
        proxy_pass http://react_operativo/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://django_operativo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s; # stitching 360 e IA pueden tardar
    }

    # Nodo blockchain: solo interno entre contenedores en producción.
    # Descomentar para exponerlo en redes de confianza:
    # location /api/blockchain/ {
    #     proxy_pass http://blockchain_gw;
    # }
}
