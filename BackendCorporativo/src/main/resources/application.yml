spring:
  application:
    name: backend-corporativo

  # Lee variables desde .env en la raíz del módulo (formato KEY=valor)
  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inmobiliaria_corporativo}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m

  # Correo saliente (SMTP). Configurar en .env
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${SERVER_PORT:8081}
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/css,text/html,application/javascript,image/svg+xml
    min-response-size: 1024
  shutdown: graceful

# ─── Configuración propia del módulo ──────────────────────────────
app:
  # JWT para el panel administrativo corporativo (independiente del backend operativo)
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-corporativo-cambiar-en-produccion-256bits}
    access-minutes: 120
    refresh-days: 7
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5174,http://localhost:4173}
  # Usuario administrador inicial (se crea si la tabla está vacía)
  admin:
    email: ${ADMIN_EMAIL:admin@inmobiliaria360.com}
    password: ${ADMIN_PASSWORD:Admin2026!}
    nombre: ${ADMIN_NOMBRE:Administrador}
  # Cloudinary (uploads del CMS)
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:corporativo}
  # Asunto "mailto" requerido por el estándar VAPID
  push:
    subject: ${PUSH_SUBJECT:mailto:groverchoquevillca80@gmail.com}
  # Correo que recibe notificaciones de nuevos leads
  notificaciones:
    email-destino: ${NOTIF_EMAIL_DESTINO:}
  # Rate limit de formularios públicos (req/min por IP)
  rate-limit:
    public-post-per-minute: ${RATE_LIMIT_PUBLIC_POST:10}
    auth-per-minute: ${RATE_LIMIT_AUTH:5}
  # URL pública del sitio (para enlaces en correos: baja/confirmación)
  frontend-url: ${FRONTEND_URL:http://localhost:5174}
  # Agente IA (chat del asistente). Llaves en .env
  agente:
    habilitado: ${AGENTE_HABILITADO:true}
    groq-api-key: ${GROQ_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}
    modelo: ${AGENTE_MODELO:openai/gpt-oss-20b}
    gemini-modelo: ${AGENTE_GEMINI_MODELO:gemini-2.5-flash}
    max-tokens: ${AGENTE_MAX_TOKENS:400}
    max-historial: ${AGENTE_MAX_HISTORIAL:8}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Detalles solo con credenciales; el público ve {"status":"UP"}
      show-details: when-authorized
      show-components: when-authorized
  health:
    # SMTP es opcional en dev; sin él el health daba DOWN falsamente
    mail:
      enabled: false
  metrics:
    tags:
      app: backend-corporativo

springdoc:
  # En producción: SWAGGER_ENABLED=false
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs

logging:
  level:
    com.inmobiliaria.corporativo: INFO
