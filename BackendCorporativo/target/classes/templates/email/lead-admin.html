<!DOCTYPE html>
<html lang="es">
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:600px;margin:0 auto;background:#ffffff;">
    <div style="background:#0f172a;padding:28px 32px;">
      <span style="color:#ffffff;font-size:20px;font-weight:bold;">Nueva solicitud — <span style="color:#38bdf8;" th:text="${tipo}">Contacto</span></span>
    </div>
    <div style="padding:32px;">
      <table style="width:100%;border-collapse:collapse;">
        <tr>
          <td style="padding:8px 0;color:#64748b;width:120px;vertical-align:top;">Nombre</td>
          <td style="padding:8px 0;color:#0f172a;font-weight:bold;" th:text="${nombre}">-</td>
        </tr>
        <tr>
          <td style="padding:8px 0;color:#64748b;vertical-align:top;">Email</td>
          <td style="padding:8px 0;color:#0f172a;" th:text="${email}">-</td>
        </tr>
        <tr>
          <td style="padding:8px 0;color:#64748b;vertical-align:top;">Teléfono</td>
          <td style="padding:8px 0;color:#0f172a;" th:text="${telefono} ?: 'No indicado'">-</td>
        </tr>
        <tr th:if="${asunto != null}">
          <td style="padding:8px 0;color:#64748b;vertical-align:top;">Asunto</td>
          <td style="padding:8px 0;color:#0f172a;" th:text="${asunto}">-</td>
        </tr>
        <tr th:if="${inmuebleId != null}">
          <td style="padding:8px 0;color:#64748b;vertical-align:top;">Publicación</td>
          <td style="padding:8px 0;color:#0f172a;">ID <span th:text="${inmuebleId}">-</span></td>
        </tr>
        <tr th:if="${adjuntoUrl != null}">
          <td style="padding:8px 0;color:#64748b;vertical-align:top;">CV adjunto</td>
          <td style="padding:8px 0;"><a th:href="${adjuntoUrl}" style="color:#0284c7;">Descargar currículum</a></td>
        </tr>
        <tr th:if="${origenUrl != null}">
          <td style="padding:8px 0;color:#64748b;vertical-align:top;">Origen</td>
          <td style="padding:8px 0;color:#0f172a;font-size:12px;" th:text="${origenUrl}">-</td>
        </tr>
      </table>
      <div style="background:#f1f5f9;border-radius:8px;padding:16px;margin:20px 0;">
        <p style="color:#64748b;font-size:12px;margin:0 0 6px;text-transform:uppercase;letter-spacing:1px;">Mensaje</p>
        <p style="color:#334155;margin:0;line-height:1.6;" th:text="${mensaje}">...</p>
      </div>
      <p style="color:#334155;">Gestiona esta solicitud desde el <strong>panel administrativo &gt; Contactos</strong>.</p>
    </div>
  </div>
</body>
</html>
