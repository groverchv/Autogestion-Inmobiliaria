<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="movil">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>movil</title>
  <link rel="manifest" href="manifest.json">
</head>
  <!-- Web Speech API Bridge for Flutter Web -->
  <script>
    window.startSpeechRecognition = function(callbackName) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        if (window[callbackName]) window[callbackName]('ERROR: Tu navegador no soporta captura de micrófono.');
        return;
      }
      if (window._currentRecognition) {
        try { window._currentRecognition.stop(); } catch(e){}
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.onresult = function(event) {
        const text = event.results[0][0].transcript;
        if (window[callbackName]) window[callbackName](text);
      };
      recognition.onerror = function(event) {
        if (window[callbackName]) window[callbackName]('ERROR: ' + event.error);
      };
      window._currentRecognition = recognition;
      try {
        recognition.start();
      } catch (err) {
        if (window[callbackName]) window[callbackName]('ERROR: ' + err);
      }
    };

    window.stopSpeechRecognition = function() {
      if (window._currentRecognition) {
        try { window._currentRecognition.stop(); } catch(e){}
      }
    };

    window.speakText = function(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES';
      utterance.rate = 1.0;
      const voices = window.speechSynthesis.getVoices();
      const spanishVoice = voices.find(v => v.lang.startsWith('es'));
      if (spanishVoice) utterance.voice = spanishVoice;
      window.speechSynthesis.speak(utterance);
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
